{% extends 'base.html' %}
{% block content %}
<section class="hero" id="hero" aria-label="Bakery welcome">
  {% if hero_image %}<img class="hero-image" src="{{ url_for('static', filename=hero_image) }}" alt="Freshly baked favorites from our bakery">{% endif %}
  <div class="hero-content"><p class="eyebrow">A LITTLE JOY. FRESHLY BAKED.</p><h1>Sweet moments.<br>Made from scratch.</h1><a class="outline-link" href="{{ url_for('menu') }}">Explore the menu <span aria-hidden="true">↗</span></a></div>
  <a class="scroll-cue" href="#chocolate">SCROLL TO DISCOVER <span aria-hidden="true">↓</span></a>
</section>
<section class="feature" id="chocolate" aria-labelledby="chocolate-title">
  <div class="feature-copy"><p class="eyebrow">MEET YOUR NEXT FAVORITE</p><h2 id="chocolate-title">Chocolate<br>Donut</h2><div class="accent-line"></div><a class="text-link" href="{{ url_for('donuts') }}">Discover our donuts ↗</a></div>
  <div class="feature-image" aria-label="Space reserved for a chocolate donut image"><!-- Add your chocolate donut image here. --></div>
</section>
{% endblock %}
